name: sync-upstream
on:
  schedule: [{ cron: "17 */6 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: fast-forward main from upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream
          git config user.name "sync-bot"; git config user.email "sync-bot@civilization.sh"
          git checkout main
          if git merge --ff-only upstream/main; then echo "fast-forwarded"; else git merge --no-edit upstream/main || { echo "::error::merge conflict — resolve manually"; exit 1; }; fi
          git push origin main
        env:
          UPSTREAM: lmwilki/civ6-mcp
